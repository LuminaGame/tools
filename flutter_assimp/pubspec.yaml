name: flutter_assimp
description: "Dart FFI bindings to Assimp: convert FBX, OBJ, Collada, 3DS, PLY, DirectX and STL models to glTF 2.0 binary (GLB) in process, with an import report."
version: 0.0.1
repository: https://github.com/LuminaGame/tools/tree/main/flutter_assimp
issue_tracker: https://github.com/LuminaGame/tools/issues
topics:
  - ffi
  - assimp
  - gltf
  - fbx
  - game-dev

# The native-assets hook compiles the vendored Assimp sources with the
# platform's C++ toolchain; these are the platforms that build is verified on.
platforms:
  android:
  linux:
  windows:

environment:
  sdk: ^3.12.0
resolution: workspace

dependencies:
  code_assets: '>=1.0.0 <3.0.0'
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: '>=1.0.0 <3.0.0'
  logging: ^1.3.0
  native_toolchain_c: '>=0.17.4 <0.20.0'

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.28.0
