name: flutter_jolt
description: "Dart FFI bindings for Jolt Physics: rigid bodies, shapes (box, sphere, capsule, cylinder, convex hull, height field, compounds), constraints, contacts and ray casts in a native physics world."
version: 0.0.1
repository: https://github.com/LuminaGame/tools/tree/main/flutter_jolt
issue_tracker: https://github.com/LuminaGame/tools/issues
topics:
  - ffi
  - physics
  - jolt
  - game-dev

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"
resolution: workspace

dependencies:
  code_assets: '>=1.0.0 <3.0.0'
  ffi: ^2.1.4
  hooks: '>=1.0.0 <3.0.0'
  logging: ^1.3.0
  native_toolchain_c: '>=0.17.4 <0.20.0'
  vector_math: ^2.1.4

# No plugin platforms: the native-assets hook builds flutter_jolt.{dll,so}
# from src/jolt_c.cpp and the Jolt static library tool/build_jolt.* builds.

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
