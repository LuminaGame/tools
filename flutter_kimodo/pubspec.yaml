name: flutter_kimodo
description: "Dart FFI bindings for kimodo.cpp: NVIDIA Kimodo text-to-motion generation (GGUF weights, CPU and Vulkan backends) on a background isolate."
version: 0.0.1
repository: https://github.com/LuminaGame/tools

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"
resolution: workspace

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.4
  path: ^1.9.0

# No plugin platforms: the native-assets hook builds flutter_kimodo.{dll,so}
# and bundles the prebuilt kimodo + ggml libraries beside it.

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
