name: flutter_riglogic
description: "Dart FFI bindings for Epic Games' OpenRigLogic: read MetaHuman DNA files and evaluate facial rigs (joints, blend shapes, animated maps) in real time."
version: 0.0.1
repository: https://github.com/LuminaGame/tools/tree/main/flutter_riglogic
issue_tracker: https://github.com/LuminaGame/tools/issues
topics:
  - ffi
  - riglogic
  - metahuman
  - facial-animation
  - game-dev

# The native-assets hook compiles the vendored OpenRigLogic sources with the
# platform's C++ toolchain; these are the platforms that build is verified on.
platforms:
  android:
  linux:
  windows:

environment:
  sdk: ^3.12.0
resolution: workspace

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.28.0

