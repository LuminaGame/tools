name: lumina_mouse_capture
description: "Pointer capture for Lumina: a Linux pointer lock with relative motion (Wayland pointer constraints, X11 grab and warp), behind a seam that tests cannot bypass."
version: 0.0.1
publish_to: none
repository: https://github.com/LuminaGame/tools

environment:
  sdk: ^3.12.0
  flutter: '>=3.3.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: LuminaMouseCapturePlugin
