name: lumina_tools_workspace
description: "Lumina tools: native FFI packages (Assimp, RigLogic, GStreamer) the Lumina engine and editor build on."
publish_to: none

environment:
  sdk: ^3.12.0

# Dart pub workspace: one resolution and one pubspec.lock for every package.
workspace:
  - flutter_assimp
  - flutter_gstreamer
  - flutter_kimodo
  - flutter_riglogic
  - flutter_riglogic/example
  - lumina_mouse_capture
  - lumina_mouse_capture/example
  - lumina_smoke

dev_dependencies:
  melos: ^7.8.0

# Native-assets hook settings (read from this, the workspace root pubspec).
# Paths are relative to this file. Both hooks default to the same places, so
# these only document the knobs: an app that depends on these packages from
# git sets them in its own root pubspec (see lumina's).
#   flutter_assimp:   filament_dir (Filament checkout with out/cmake-release*)
#   flutter_riglogic: riglogic_lib_dir (built OpenRigLogic static library)
#   flutter_kimodo:   kimodo_dir (unpacked kimodo prebuilt, tool/build_kimodo.*)
#   both, Linux:      libcxx_dir (flutter_filament/third_party/libcxx)
hooks:
  user_defines:
    flutter_assimp:
      filament_dir: filament

melos:
  scripts:
    analyze:
      description: flutter analyze in every package.
      exec: flutter analyze .
    format:
      description: Format every package's Dart sources.
      exec: dart format .
    format:check:
      description: Fail when a package's Dart sources are not formatted.
      exec: dart format --output=none --set-exit-if-changed .
    test:
      description: flutter test in every package that has tests, one package at a time.
      run: flutter test --concurrency=1
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
